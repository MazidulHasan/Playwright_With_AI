- id: FLOW-DP-001
  name: Select Single Date with Common Datepicker
  type: flow
  module: form-picker
  feature: Common Datepicker - Happy Path
  priority: critical
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Test the complete journey of selecting a date using the Common Datepicker.
      Verifies: input click opens calendar, day selection populates the input field,
      and the calendar dismisses after selection.
    coverage:
      - Input click opens calendar popup
      - Calendar shows current month (APRIL 2026)
      - Today (14) is highlighted
      - Clicking a day populates the input
      - Calendar closes after selection
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
      reason: Wait for Angular lazy-load
    - action: screenshot
      name: flow-dp-001-initial
    - action: click
      selector: "input[placeholder='Form Picker']"
    - action: wait
      ms: 500
      reason: Wait for calendar animation
    - action: screenshot
      name: flow-dp-001-calendar-open
    - action: click
      selector: "nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('10')"
    - action: wait
      ms: 300
    - action: screenshot
      name: flow-dp-001-date-selected
  expected:
    - Calendar popup opens below the input
    - Current month and year shown in header
    - Today (14) highlighted with blue border
    - Clicking day 10 populates input with date string
    - Calendar dismisses after selection

- id: FLOW-DP-002
  name: Select Date Range with Range Picker
  type: flow
  module: range-picker
  feature: Range Datepicker - Happy Path
  priority: critical
  web3: false
  wallet_popups: 0
