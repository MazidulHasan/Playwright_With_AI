- id: FLOW-DP-003
  name: Select Date Within Min/Max Boundary
  type: flow
  module: minmax-picker
  feature: Min/Max Datepicker - Happy Path
  priority: critical
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Test selecting a valid date within the ±5-day boundary of the Min/Max Picker.
      Min = today - 5 (Apr 9), Max = today + 5 (Apr 19).
      Verifies: dates outside range are visually disabled, valid date can be selected.
    coverage:
      - Disabled dates are greyed/unclickable
      - Valid dates in range are selectable
      - Input populated after valid selection
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: click
      selector: "input[placeholder='Min Max Picker']"
    - action: wait
      ms: 500
    - action: screenshot
      name: flow-dp-003-minmax-open
    - action: click
      selector: "nb-datepicker nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('17')"
    - action: wait
      ms: 300
    - action: screenshot
      name: flow-dp-003-valid-date-selected
  expected:
    - Calendar opens showing current month
    - Dates before Apr 9 are greyed out and not interactive
    - Dates after Apr 19 are greyed out and not interactive
    - Clicking Apr 17 (within range) populates the input
    - Calendar dismisses after selection

