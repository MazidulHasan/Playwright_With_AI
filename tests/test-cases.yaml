- id: NEG-DP-003
  name: Min/Max Picker - Boundary Dates Are Selectable (Edge Case)
  type: negative
  module: minmax-picker
  feature: Min/Max - Boundary Inclusivity
  priority: medium
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Verify the exact boundary dates (min = Apr 9, max = Apr 19) are selectable.
      Boundary dates should be inclusive and not treated as disabled.
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: click
      selector: "input[placeholder='Min Max Picker']"
    - action: wait
      ms: 500
    - action: screenshot
      name: neg-dp-003-min-boundary
    - action: click
      selector: "nb-datepicker:last-of-type nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('9')"
    - action: wait
      ms: 300
    - action: screenshot
      name: neg-dp-003-min-selected
    - action: click
      selector: "input[placeholder='Min Max Picker']"
    - action: wait
      ms: 500
    - action: click
      selector: "nb-datepicker:last-of-type nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('19')"
    - action: wait
      ms: 300
    - action: screenshot
      name: neg-dp-003-max-selected
  expected:
    - Apr 9 (min) is NOT greyed out — is selectable
    - Apr 9 click populates input
    - Apr 19 (max) is NOT greyed out — is selectable
    - Apr 19 click populates input

- id: NEG-DP-004
  name: Range Picker - Re-clicking Start Date Resets Range
  type: negative
  module: range-picker
  feature: Range Datepicker - Reset on Re-click
  priority: medium
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Verify that after selecting a complete range, clicking the input again and
      choosing a new start date resets the range (not appends to it).
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: click
      selector: "input[placeholder='Range Picker']"
    - action: wait
      ms: 500
    - action: click
      selector: "nb-rangepicker nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('5')"
    - action: wait
      ms: 200
    - action: click
      selector: "nb-rangepicker nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('10')"
    - action: wait
      ms: 300
    - action: screenshot
      name: neg-dp-004-first-range
    - action: click
      selector: "input[placeholder='Range Picker']"
    - action: wait
      ms: 500
    - action: click
      selector: "nb-rangepicker nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('20')"
    - action: wait
      ms: 200
    - action: screenshot
      name: neg-dp-004-range-reset
  expected:
    - Second interaction resets the range selection
    - New start date (20) is set, previous range is cleared
    - Calendar remains open waiting for new end date

- id: NEG-DP-005
  name: Common Datepicker - Bounding Month Days Are Unselectable
  type: negative
  module: form-picker
  feature: Common Datepicker - Bounding Month Cells
  priority: low
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Verify that the greyed-out "bounding month" days shown at the edges of the
      calendar grid (e.g. Mar 29-31 shown at top of April, May 1-2 at bottom)
      either navigate to that month or are non-interactive, not treated as
      current-month selections.
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: click
      selector: "input[placeholder='Form Picker']"
    - action: wait
      ms: 500
    - action: screenshot
      name: neg-dp-005-bounding-days-visible
    - action: click
      selector: "nb-calendar-day-cell.bounding-month .cell-content:has-text('29')"
    - action: wait
      ms: 300
    - action: screenshot
      name: neg-dp-005-bounding-day-clicked
  expected:
    - Bounding month days (Mar 29, 30, 31) appear in lighter grey style
    - Clicking a bounding day either navigates to that month OR is ignored
    - Not treated as an April date selection

