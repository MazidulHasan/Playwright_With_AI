# NETWORK TESTS — Behavior under adverse network conditions
# ============================================================

- id: NET-DP-001
  name: Datepicker Page Loads Under High Latency
  type: network
  module: ui
  feature: Network Handling - High Latency
  priority: medium
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Verify the datepicker page loads and functions correctly with 2000ms added
      latency. Since all data is mock/in-memory, the calendar itself should work
      fine; only the initial Angular bundle load may be affected.
  steps:
    - action: set-network
      options: "--latency 2000"
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 5000
      reason: Allow for delayed page load
    - action: screenshot
      name: net-dp-001-high-latency-loaded
    - action: click
      selector: "input[placeholder='Form Picker']"
    - action: wait
      ms: 1000
    - action: screenshot
      name: net-dp-001-calendar-works
    - action: clear-network
  expected:
    - Page eventually loads (may take longer)
    - Calendar popup still opens and functions
    - No timeout errors for calendar interaction (it is client-side only)

