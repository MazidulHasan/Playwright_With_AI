# ============================================================
# EXTERNAL LINK TESTS — Footer link validation
# ============================================================

- id: LINK-DP-001
  name: Footer Social Links Are Accessible
  type: external-link
  module: links
  feature: External Links - Footer Icons
  priority: medium
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Verify that the 4 social icon links in the page footer (GitHub, Facebook,
      Twitter, LinkedIn — visible in screenshots) are accessible and not broken.
    what_is_checked:
      - HTTP status (not 404)
      - No "Not Found" text on linked page
      - Links are reachable within timeout
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: collect-external-links
      selector: "nb-layout-footer a[href^='http'], footer a[href^='http']"
      exclude_domains:
        - localhost
        - 127.0.0.1
    - action: check-external-links
      timeout: 10000
      check_for_404: true
      check_for_not_found_text: true
    - action: screenshot
      name: link-dp-001-footer-links
  expected:
    - All footer social links return HTTP 200
    - No 404 status codes
    - No "Not Found" text on linked pages
    - GitHub, Facebook, Twitter, LinkedIn pages load successfully
