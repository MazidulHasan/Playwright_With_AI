# ============================================================
# ROLE & PERMISSION TESTS
# ============================================================

- id: ROLE-DP-001
  name: Datepicker Page Accessible Without Authentication
  type: role
  module: auth
  feature: Permission Control - Guest Access
  priority: high
  web3: false
  wallet_popups: 0
  depends_on: []
  role: guest
  description:
    purpose: |
      Verify the datepicker page is accessible without logging in.
      The app uses NbDummyAuthStrategy — any credentials work and the page
      does not enforce authentication for navigation.
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: screenshot
      name: role-dp-001-no-auth
  expected:
    - Page loads successfully with all 3 datepicker cards
    - No redirect to /auth/login
    - No "access denied" message
    - All datepicker inputs are interactive

# ============================================================
# NEGATIVE TESTS — Error and boundary scenarios
# ============================================================

- id: NEG-DP-001
  name: Min/Max Picker - Cannot Select Date Before Min
  type: negative
  module: minmax-picker
  feature: Min/Max - Below Minimum Boundary
  priority: high
  web3: false
  wallet_popups: 0
  depends_on: []
  description:
    purpose: |
      Verify that a date before the minimum (today - 5 = Apr 9) cannot be selected.
      The date should be visually disabled and clicking it should have no effect.
  steps:
    - action: navigate
      url: /pages/forms/datepicker
    - action: wait
      ms: 2000
    - action: click
      selector: "input[placeholder='Min Max Picker']"
    - action: wait
      ms: 500
    - action: click
      selector: "nb-datepicker:last-of-type nb-calendar-day-cell:not(.bounding-month) .cell-content:has-text('5')"
    - action: wait
      ms: 300
    - action: screenshot
      name: neg-dp-001-below-min
  expected:
    - Apr 5 is rendered as disabled (greyed out)
    - Clicking Apr 5 does NOT populate the input
    - Calendar remains open (not dismissed by disabled click)
    - No error thrown

