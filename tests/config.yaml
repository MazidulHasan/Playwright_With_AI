config.yaml project:
  name: ngx-admin Datepicker
  url: http://localhost:3000
  page: /pages/forms/datepicker
  framework: Angular 14 + Nebular 10
  title: playwright-test-admin Demo Application

web3:
  enabled: false

viewports:
  desktop:
    width: 1920
    height: 1080
  tablet:
    width: 768
    height: 1024
  mobile:
    width: 375
    height: 667
    isMobile: true

roles:
  - id: guest
    name: Guest
    description: No authentication required — Nebular DummyAuthStrategy allows all access
    setup: none

modules:
  - id: form-picker
    name: Common Datepicker
    description: Standard single-date picker with no date restrictions
    selector: "input[placeholder='Form Picker']"
  - id: range-picker
    name: Range Datepicker
    description: Dual-date picker for selecting a start and end date range
    selector: "input[placeholder='Range Picker']"
  - id: minmax-picker
    name: Min/Max Datepicker
    description: Single-date picker constrained to today ±5 days
    selector: "input[placeholder='Min Max Picker']"
    min: today - 5 days
    max: today + 5 days

